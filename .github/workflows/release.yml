name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: 校验版本并创建 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - id: release
        name: 校验发布版本
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Release tag 必须是 v<major>.<minor>.<patch>，或附带 -alpha.N、-beta.N、-rc.N 预发布后缀，实际为：$RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "VERSION=$VERSION 与 tag=$RELEASE_TAG 不一致，请先更新 VERSION 并运行 node scripts/sync-version.mjs。" >&2
            exit 1
          fi

          node scripts/sync-version.mjs --check
          git fetch --no-tags origin refs/heads/develop:refs/remotes/origin/develop
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" refs/remotes/origin/develop; then
            echo "发布 tag 必须指向已合入 develop 的提交：$RELEASE_TAG" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验 CHANGELOG 并提取发布说明
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"(?ms)^##[ \t]+{re.escape(tag)}[ \t]*\r?\n(.*?)(?=^##[ \t]+|\Z)"
          )
          match = pattern.search(changelog)
          if match is None or not match.group(1).strip():
              print(
                  f"CHANGELOG.md 缺少非空的 `## {tag}` 发布章节。",
                  file=sys.stderr,
              )
              sys.exit(1)

          Path("RELEASE_BODY.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ButvanAgent ${{ steps.release.outputs.tag }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'false' }}
