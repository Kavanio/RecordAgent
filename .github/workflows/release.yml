name: Release Desktop App

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送、且与 VERSION 完全一致的发布 tag（例如 v0.1.1）
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-metadata:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      target_commitish: ${{ steps.release.outputs.target_commitish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: release
        name: 校验 tag 与版本源
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          node scripts/sync-version.mjs --check

          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/develop" ]; then
            RELEASE_TAG="v$VERSION-develop.$RUN_NUMBER"
            PRERELEASE=true
            TARGET_COMMITISH="$COMMIT_SHA"
          else
            PRERELEASE=false
            TARGET_COMMITISH="$RELEASE_TAG"
          fi

          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "发布 tag 必须是 v<major>.<minor>.<patch> 形式，实际为：$RELEASE_TAG" >&2
            exit 1
          fi

          if [ "$PRERELEASE" = "false" ]; then
            git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null || {
              echo "tag 不存在于仓库：$RELEASE_TAG" >&2
              exit 1
            }
            if [ "v$VERSION" != "$RELEASE_TAG" ]; then
              echo "VERSION=$VERSION 与 tag=$RELEASE_TAG 不一致，请先更新 VERSION 并运行 node scripts/sync-version.mjs。" >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$TARGET_COMMITISH" >> "$GITHUB_OUTPUT"

  create-release:
    name: 创建草稿 Release
    needs: release-metadata
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - name: 创建草稿 Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          target_commitish: ${{ needs.release-metadata.outputs.target_commitish }}
          name: ButvanAgent v${{ needs.release-metadata.outputs.version }}
          body: |
            ## 构建产物

            - macOS：Apple Silicon 与 Intel 的 dmg 安装包
            - Linux：AppImage 与 deb 安装包
            - Windows：msi 与 NSIS 安装包
            - 应用已内嵌 Spring Boot sidecar 与最小 JRE，无需另装 Java
          draft: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          generate_release_notes: true

  publish-tauri:
    name: ${{ matrix.name }}
    needs:
      - release-metadata
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            tauri_args: --target aarch64-apple-darwin
            release_files: agent-frontend/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
          - name: macOS Intel
            runner: macos-13
            tauri_args: --target x86_64-apple-darwin
            release_files: agent-frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
          - name: Linux x64
            runner: ubuntu-latest
            tauri_args: ''
            release_files: |
              agent-frontend/src-tauri/target/release/bundle/**/*.AppImage
              agent-frontend/src-tauri/target/release/bundle/**/*.deb
          - name: Windows x64
            runner: windows-latest
            tauri_args: ''
            release_files: |
              agent-frontend/src-tauri/target/release/bundle/**/*.msi
              agent-frontend/src-tauri/target/release/bundle/**/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.tag }}

      - uses: ./.github/actions/setup-desktop-build

      - name: 构建桌面安装包
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          # 配置以下 Secrets 后，macOS 构建会自动执行签名与公证；未配置时保持可构建。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: agent-frontend
          args: ${{ matrix.tauri_args }}
          uploadUpdaterJson: false

      - name: 验证内嵌后端 sidecar
        shell: bash
        run: node scripts/verify-sidecar.mjs

      - name: 上传已验证的安装包
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          files: ${{ matrix.release_files }}
          fail_on_unmatched_files: true

  publish-prerelease:
    name: 发布 develop 预发布
    needs:
      - release-metadata
      - publish-tauri
    if: needs.release-metadata.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 构建完成后公开预发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-metadata.outputs.tag }}
          name: ButvanAgent v${{ needs.release-metadata.outputs.version }} develop.${{ github.run_number }}
          draft: false
          prerelease: true
          make_latest: false
