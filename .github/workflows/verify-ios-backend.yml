name: Verify iOS Business Backend

on:
  pull_request:
    paths:
      - 'RecordAgent APP/IOS APP/backend/**'
      - '.github/workflows/verify-ios-backend.yml'
  push:
    branches: [develop]
    paths:
      - 'RecordAgent APP/IOS APP/backend/**'
      - '.github/workflows/verify-ios-backend.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'RecordAgent APP/IOS APP/backend/pom.xml'
      - name: 格式、单元测试、PostgreSQL 集成测试和打包
        working-directory: 'RecordAgent APP/IOS APP/backend'
        run: mvn --batch-mode --no-transfer-progress verify
