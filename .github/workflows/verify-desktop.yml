name: Verify Desktop Build

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            tauri_args: --target aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-13
            tauri_args: --target x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-latest
            tauri_args: ''
          - name: Windows x64
            runner: windows-latest
            tauri_args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-desktop-build

      - name: 校验版本一致性
        shell: bash
        run: node scripts/sync-version.mjs --check

      - name: 构建桌面安装包
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: agent-frontend
          args: ${{ matrix.tauri_args }}

      - name: 验证内嵌后端 sidecar
        shell: bash
        run: node scripts/verify-sidecar.mjs
