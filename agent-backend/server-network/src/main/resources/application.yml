server:
  port: 8081
  shutdown: graceful
  ssl:
    # sidecar 默认使用 HTTP；远程部署通过受保护环境变量显式启用 TLS。
    enabled: ${BUTVAN_SERVER_SSL_ENABLED:false}
    key-store: ${BUTVAN_SERVER_SSL_KEY_STORE:}
    key-store-type: ${BUTVAN_SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${BUTVAN_SERVER_SSL_KEY_STORE_PASSWORD:}

# 远程桌面客户端来源通过 BUTVAN_CORS_ALLOWED_ORIGINS 显式追加；禁止使用通配符开放局域网 API。
butvan:
  api:
    access-token: ${BUTVAN_API_TOKEN:}
    require-token: ${BUTVAN_API_REQUIRE_TOKEN:false}
  cors:
    allowed-origins: ${BUTVAN_CORS_ALLOWED_ORIGINS:tauri://localhost,http://tauri.localhost,https://tauri.localhost,http://localhost:5173,http://127.0.0.1:5173}

spring:
  servlet:
    multipart:
      # 全局入口覆盖当前最大的备份导入需求，各业务接口仍执行自身的文件大小校验。
      max-file-size: 512MB
      max-request-size: 520MB
  lifecycle:
    timeout-per-shutdown-phase: 5s
  config:
    import:
      - classpath:application-vendor.yml

# 飞书 SDK 的 INFO 断连日志包含带临时凭证的完整 WebSocket URL，禁止输出。
logging:
  level:
    com.lark.oapi.ws.Client: WARN
