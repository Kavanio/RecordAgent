name: RecordAgent
options:
  bundleIdPrefix: com.butvan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  RecordAgent:
    type: application
    platform: iOS
    sources:
      - path: RecordAgent
    info:
      path: RecordAgent/App/Info.plist
    settings:
      base:
        PRODUCT_NAME: RecordAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.butvan.recordagent
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  RecordAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecordAgentTests
    info:
      path: RecordAgentTests/Info.plist
    dependencies:
      - target: RecordAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.butvan.recordagent.tests

schemes:
  RecordAgent:
    build:
      targets:
        RecordAgent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecordAgentTests
