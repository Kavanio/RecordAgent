name: RecordAgent
options:
  bundleIdPrefix: com.butvan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultLanguage: zh-Hans
  knownRegions:
    - en
    - zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  RecordAgent:
    type: application
    platform: iOS
    sources:
      - path: RecordAgent
    info:
      path: RecordAgent/App/Info.plist
      properties:
        UILaunchScreen: {}
        NSMotionUsageDescription: "用于让日历便签随手机移动轻微摇晃。 / Used to gently move calendar notes with your phone."
        NSLocalNetworkUsageDescription: "用于在测试阶段连接同一局域网内电脑上的 RecordAgent 后端。 / Connect to the RecordAgent backend on your computer for testing."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        PRODUCT_NAME: RecordAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.butvan.recordagent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7JWU292AKK

  RecordAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecordAgentTests
    info:
      path: RecordAgentTests/Info.plist
    dependencies:
      - target: RecordAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.butvan.recordagent.tests

schemes:
  RecordAgent:
    build:
      targets:
        RecordAgent: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RecordAgentTests
