spring:
  application:
    name: recordagent-business-backend
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${RECORDAGENT_DB_URL}
    username: ${RECORDAGENT_DB_USER}
    password: ${RECORDAGENT_DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
server:
  port: ${RECORDAGENT_SERVER_PORT:9090}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
