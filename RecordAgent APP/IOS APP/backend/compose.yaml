services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: record
      POSTGRES_USER: ${RECORDAGENT_DB_USER:?set RECORDAGENT_DB_USER}
      POSTGRES_PASSWORD: ${RECORDAGENT_DB_PASSWORD:?set RECORDAGENT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recordagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  recordagent-postgres:
